services:
  - type: pserv
    name: contract-system-db
    runtime: docker
    plan: basic-256mb
    region: oregon
    databaseName: contract_system
    user: contract_system

  - type: web
    name: contract-system-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pip install ./backend
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contract-system-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: contract-system-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://contract-system-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
